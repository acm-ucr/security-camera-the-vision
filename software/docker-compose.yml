version: '3.8'

services:
  security-camera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-camera-vision
    restart: unless-stopped

    # Mount config and model files from host
    volumes:
      # Config file (required)
      - ${CONFIG_PATH:-./config.env}:/app/config.env:ro
      # Model file (required)
      - ${MODEL_PATH:-./50epoch.pt}:/app/models/model.pt:ro
      # Logs directory (for persistent logging and debugging)
      - ./logs:/app/logs

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/model.pt
      - CONFIG_PATH=/app/config.env
      # CPU optimization for Docker on macOS (MPS not available in Docker)
      # These settings help maximize CPU performance
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4

    # Network mode for better streaming performance
    network_mode: bridge

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
